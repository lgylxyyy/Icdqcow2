name: 功能建议 / Feature request
description: 提一个想要的新功能或改进 · Suggest a new feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **中文在每项上方，English below each item.**

        提之前请先搜一下现有 issue，也许已经有人提过了。
        Please search existing issues first — it may already be suggested.

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认 / Before submitting
      options:
        - label: 我已经搜过现有 issue / I have searched existing issues
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题 / What problem are you trying to solve
      description: |
        先说痛点，再说方案 —— 这样别人能判断有没有更简单的解法。
        Describe the pain point first, then the solution — so others can judge whether a simpler fix exists.
      placeholder: |
        例：每次给同一批虚拟机做盘，都要重新填一遍同样的分区大小，很麻烦。
        e.g. Every time I build disks for the same batch of VMs I have to re-enter the same partition sizes.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望它怎么工作 / How you would like it to work
      placeholder: |
        例：建盘页能保存/载入分区方案。
        e.g. Let the create-disk page save and load partition presets.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案 / Alternatives you have considered
      description: 包括"现在我是怎么绕过去的"。
      placeholder: |
        例：现在只能截图记下来，下次照着填。
        e.g. Right now I screenshot the layout and copy it by hand next time.
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 这属于哪一块 / Which area does this belong to
      options:
        - 建盘 / 分区表 · Disk creation / partition table
        - 释放映像 / 装机 · Image deployment
        - 引导 / 自检 · Boot / self-check
        - 恢复环境 (WinRE) · Recovery environment
        - 文件浏览 / 编辑 · File browser / editor
        - 界面 / 交互 · UI / interaction
        - 其他 / Other
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 其他 / Anything else
      description: |
        参考截图、同类软件怎么做的、相关文档链接，都可以放这里。
        Reference screenshots, how other tools do it, related links — all welcome here.
    validations:
      required: false
