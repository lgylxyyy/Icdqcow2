name: Bug 报告 / Bug report
description: 报告一个可复现的问题 · Report a reproducible problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **中文在每项上方，English below each item.**

        提之前请先搜一下现有 issue，也许已经有人报过了。
        Please search existing issues first — it may already be reported.

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认 / Before submitting
      options:
        - label: 我已经搜过现有 issue / I have searched existing issues
          required: true
        - label: 我确认操作前已把虚拟机关机 / The VM was shut down before the operation
          required: true
        - label: 我用的是最新版本 / I am on the latest version
          required: true

  - type: textarea
    id: what
    attributes:
      label: 发生了什么 / What happened
      description: |
        一句话说清现象。中文写完请补一句英文。
        Describe the symptom in one sentence.
      placeholder: |
        例：释放 Windows 10 x64 镜像到 GPT 盘，进度到 87% 时卡住不动。
        e.g. Applying a Windows 10 x64 image to a GPT disk stalls at 87%.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 你期望什么 / What you expected
      placeholder: |
        例：进度继续到 100% 并提示完成。
        e.g. The progress should continue to 100% and report completion.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 越具体越好。如果和某个镜像有关，说清是哪个 Windows 版本、x86 还是 x64。
      placeholder: |
        1. 主页 → 释放映像
        2. 选 install.wim，索引 1
        3. 目标盘：GPT，100 GB
        4. 勾选「写入引导」→ 开始
        5. 卡在 87%

        1. Home → Apply image
        2. Pick install.wim, index 1
        3. Target disk: GPT, 100 GB
        4. Enable "Write boot files" → Start
        5. Stalls at 87%
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App 版本 / App version
      description: 设置 → 关于 → 版本。形如 `0.1.0`。
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: tool-version
    attributes:
      label: 工具版本 / Tool version
      description: 设置 → 关于 → 工具版本（`libimgtool.so` 的构建标识）。
      placeholder: "0.1.0 (2026-11-09)"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备与系统 / Device and OS
      description: 机型 + Android 版本 + CPU 架构。
      placeholder: "Redmi K90 Pro Max · Android 17 · arm64-v8a"
    validations:
      required: true

  - type: dropdown
    id: boot-mode
    attributes:
      label: 启动方式 / Boot mode
      description: 出问题的这张盘是按哪种方式做的。
      options:
        - BIOS (MBR)
        - UEFI 64 (GPT)
        - UEFI 32 (GPT, x86 Windows)
        - 不确定 / Not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志与截图 / Logs and screenshots
      description: |
        设置 → 关于 → 运行日志 → 导出，把文件拖进来。
        如果是错误码，请把错误码原文贴上来（不要只写"失败了"）。
        Settings → About → Logs → Export, then drag the file here.
        If an error code is shown, paste it verbatim (don't just say "it failed").

        截图可以直接拖进这个框。
        Screenshots can be dragged into this box.
      placeholder: |
        拖入日志文件或截图 / Drag log files or screenshots here
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 其他 / Anything else
      description: 有什么补充的都可以写在这里。
    validations:
      required: false
