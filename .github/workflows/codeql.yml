# CodeQL —— Kotlin/Java 静态分析
#
# 历史：仓库没有 Gradle wrapper 时，GitHub「默认设置」的 autobuild 抓到 runner 自带的
# Gradle 8.6，而本项目用 AGP 9.4.1（要求 ≥ 9.6），构建阶段直接失败。
# 当时的绕行是 build-mode: none（只扫源码、不编译），代价是 CodeQL 自己去 Maven Central
# 猜依赖 —— 猜不到就报 "Fetching a dependency jar failed"，界面上就是那几条黄色诊断。
#
# 2026-11-10 wrapper（9.8.2）入库后，改成 build-mode: manual：由我们真正跑一次编译，
# CodeQL 从真实 classpath 提取，不再猜依赖。两个模块都编译，testbench 也要被扫到。
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"   # 每周一 03:00 UTC，兜住依赖与规则库更新

permissions:
  contents: read
  security-events: write   # 上传分析结果到 Security 页签

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: 分析 Kotlin/Java
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 SDK 组件
        run: |
          set -eu
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          [ -x "$SDKM" ] || SDKM=$(command -v sdkmanager)
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" \
            || "$SDKM" "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      # 版本来自 gradle/wrapper/gradle-wrapper.properties
      - name: 准备 Gradle（缓存）
        uses: gradle/actions/setup-gradle@v4

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality

      # 真正编译一次：CodeQL 据此提取真实 classpath，不再靠猜依赖
      - name: 编译主 App
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # testbench 是独立工程（自己的 settings.gradle），也要扫
      - name: 编译 testbench
        run: ./gradlew -p testbench :app:assembleDebug --no-daemon --stacktrace

      - name: 分析并上传结果
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
