name: Release APK

# 触发方式：
#   1) 手动：Actions → Release APK → Run workflow
#   2) 打标签：git tag v0.1.0 && git push origin v0.1.0  → 构建 + 发 GitHub Release
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write          # 只有 tag 触发时才用到（创建 Release）

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 本项目发布证书的 SHA-256 指纹（与仓库 README「签名」章节一致）。
  # 签名结果若对不上，说明用错了密钥 —— 直接让构建失败，别把错签的包发出去。
  EXPECTED_SHA256: "823f40ba39912855d7ac5ec9eb3b1f18d8b7e04043d390bab5ea5800aba1fbe3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 指纹在 Signing.kt / 本文件 / README 中英两版各写了一遍，
      # 改一处漏一处会让「CI 验签通过」和「文档里写的指纹」自相矛盾。
      - name: 校验签名指纹来源一致
        run: python3 tools/check_signing_fingerprint.py

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 不用 android-actions/setup-android：它在 sdkmanager 里硬装已被移除的 "tools"
      # 包，直接 exit 1（实测 2026-11-10 首次运行就是这么挂的）。
      # GitHub 的 ubuntu runner 自带完整 SDK，直接用系统里那份即可。
      - name: 安装编译所需的 SDK 组件
        run: |
          set -eu
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          [ -x "$SDKM" ] || SDKM=$(command -v sdkmanager)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          # 注意平台包的命名：SDK 仓库里叫 platforms;android-37.0（带次版本号），
          # 写成 platforms;android-37 会报 "Failed to find package"（实测）。
          "$SDKM" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" \
            || "$SDKM" "platform-tools" "platforms;android-37" "build-tools;37.0.0"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      # 版本来自 gradle/wrapper/gradle-wrapper.properties，不由 workflow 指定；
      # 这个 action 现在只负责缓存与文件权限。
      - name: 准备 Gradle（缓存）
        uses: gradle/actions/setup-gradle@v4

      # 密钥来自仓库 Secrets（加密存储，任何人读不出内容，日志里也会被自动打码）。
      # 没配置 Secrets 时友好跳过：构建出的是未签名 APK，只能验证编译是否通过。
      - name: 还原签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::warning title=未配置签名 Secrets::本次产出未签名 APK，无法安装；配置 KEYSTORE_B64 等 4 个 Secret 后才会出正式签名包"
            echo "SIGNED=0" >> "$GITHUB_ENV"
            exit 0
          fi
          umask 077
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS" > keystore.properties
          echo "SIGNED=1" >> "$GITHUB_ENV"

      - name: 构建 release
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace -PciRun="${{ github.run_number }}"

      - name: 验签并核对指纹
        run: |
          set -eu
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "产物：$APK（$(stat -c %s "$APK") 字节）"
          if [ "${SIGNED}" != "1" ]; then
            echo "::notice::未签名，跳过验签"
            exit 0
          fi
          BT=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/ | sort -V | tail -1)
          "${BT}apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt
          GOT=$(grep -i "SHA-256 digest" /tmp/certs.txt | head -1 | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          if [ "$GOT" != "$EXPECTED_SHA256" ]; then
            echo "::error title=签名指纹不符::期望 $EXPECTED_SHA256，实际 $GOT —— 用错密钥了，不要发布"
            exit 1
          fi
          echo "✅ 指纹一致：$GOT"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # 无论成败都删掉临时密钥，别让它留在 runner 上
      - name: 清理临时密钥
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.jks" keystore.properties

      - name: 打标签时同时发 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "$GITHUB_REF_NAME" \
            --notes "自动构建。校验签名：apksigner verify --print-certs app-release.apk（SHA-256 见 README 签名章节）" \
            --generate-notes || \
          gh release upload "$GITHUB_REF_NAME" "$APK" --clobber

      - name: 安装提示
        run: |
          {
            echo "### 安装到手机"
            echo ""
            echo "1. 手机浏览器打开本仓库 Releases → 下载 apk（tag 触发时才有 Release）"
            echo "2. 或在电脑上："
            echo '```bash'
            echo "gh run download -n app-release-apk -D /tmp/apk"
            echo "adb install -r /tmp/apk/*.apk"
            echo '```'
            echo ""
            echo "注意：现在是 debug 签名，装 release 包需先卸载（签名不符），会清数据。"
          } >> "$GITHUB_STEP_SUMMARY"
