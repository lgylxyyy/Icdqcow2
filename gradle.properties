org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# 构建用系统 gradle 8.11.1（/workspace/sdk/gradle/gradle-8.11.1/bin/gradle），不用 wrapper
# 本机是 aarch64：AGP 默认的 aapt2 是 x86_64 的，起不来；用 SDK 里能跑的那份
android.aapt2FromMavenOverride=/workspace/sdk/android-sdk/build-tools/37.0.0/aapt2

# 沙箱里 Kotlin 编译 daemon 常起不来，进程内编译更稳
kotlin.compiler.execution.strategy=in-process

# 禁用 AGP 的 SDK 自动下载/在线包列表查询（本机连不上 dl.google.com，每次白等超时）
android.builder.sdkDownload=false
