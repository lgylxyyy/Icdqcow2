org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# 构建用 Gradle wrapper（版本见 gradle/wrapper/gradle-wrapper.properties）

# 沙箱里 Kotlin 编译 daemon 常起不来，进程内编译更稳
kotlin.compiler.execution.strategy=in-process

# 禁用 AGP 的 SDK 自动下载/在线包列表查询（本机连不上 dl.google.com，每次白等超时）
android.builder.sdkDownload=false

# ★ AGP 9.4.1 的 optimizeReleaseResources 是个"没声明输出却执行动作"的空壳任务
#   （构建日志: "Task has not declared any outputs despite executing actions"），
#   结果 release APK 里丢掉了 AndroidManifest.xml 和 resources.arsc，装不上、也验不了签名。
#   关掉资源优化后 release 走 linked ap_ 直出，APK 恢复正常（218 条目 vs 之前 95 条目）。
android.enableResourceOptimizations=false
